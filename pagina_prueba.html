<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clases particulares de Matemáticas y Física</title>
<meta name="description" content="Reserva clases particulares de Matemáticas y Física para ESO y Bachillerato.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFCFF; --surface:#FFFFFF; --grid:#E3EAF6; --line:#CBD5E6;
  --ink:#1F3A93; --ink-soft:#E8EEFB; --text:#262A33; --muted:#5C6475;
  --margin:#D8484A; --highlight:#FFE45C; --ok:#1E7A4C; --ok-soft:#E3F4EA;
  --warn:#8A5A00; --warn-soft:#FFF4D1; --bad:#B3261E; --bad-soft:#FBE7E5;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131923; --surface:#1A2130; --grid:#1D2533; --line:#2E394C;
    --ink:#9CB3FF; --ink-soft:#23304D; --text:#E6E9F0; --muted:#9AA3B5;
    --margin:#EE6A6A; --highlight:#E2C43A; --ok:#62CC91; --ok-soft:#18342A;
    --warn:#E9C15C; --warn-soft:#3A3120; --bad:#F08A82; --bad-soft:#3A2224;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; font-family:var(--body); font-size:17px; line-height:1.55; color:var(--text);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px; min-height:100vh;
}
.page{max-width:1080px; margin:0 auto; padding:0 20px 40px; position:relative}
@media (min-width:760px){
  .page{padding-left:96px}
  .page::before{content:""; position:absolute; left:64px; top:0; bottom:0; width:2px; background:var(--margin); opacity:.55}
}
h1,h2,h3{font-family:var(--display); color:var(--text); margin:0}
h1{font-size:clamp(2.2rem,6vw,3.6rem); font-weight:800; line-height:1.02; letter-spacing:-.02em}
h2{font-size:1.6rem; font-weight:700; letter-spacing:-.01em}
h3{font-size:1.1rem; font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--ink); outline-offset:2px}

header.hero{padding:56px 0 36px}
.hero .lead{max-width:60ch; margin-top:14px; font-size:1.15rem; color:var(--muted)}
.facts{display:flex; flex-wrap:wrap; gap:12px 28px; margin-top:26px; align-items:baseline}
.price{font-family:var(--display); font-weight:800; font-size:2.4rem; color:var(--ink); line-height:1}
.price small{font-size:1rem; font-weight:500; color:var(--muted); margin-left:4px}
.fact{color:var(--muted)}
.fact b{color:var(--text)}

nav.tabs{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:0 0 28px; border-bottom:2px solid var(--line)}
nav.tabs button{background:none; border:0; padding:10px 14px; cursor:pointer; color:var(--muted); font-weight:700; border-bottom:3px solid transparent; margin-bottom:-2px}
nav.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--ink)}
nav.tabs .salir{margin-left:auto; font-weight:400}
.badge{display:inline-block; min-width:1.4em; padding:0 .45em; border-radius:999px; background:var(--margin); color:#fff; font-size:.8rem; margin-left:6px; text-align:center}

section.block{margin-bottom:48px}
.block-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:16px}
.hint{color:var(--muted); font-size:.95rem}

.days{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px}
.day{background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:12px 12px 14px}
.day h3{font-size:1rem; margin-bottom:2px}
.day .date{color:var(--muted); font-size:.9rem; margin-bottom:10px}
.slot{display:block; width:100%; text-align:left; background:none; border:1px solid var(--line); border-radius:4px; padding:7px 10px; margin-top:6px; cursor:pointer; font-variant-numeric:tabular-nums}
.slot:hover:not(:disabled){background:linear-gradient(transparent 55%, var(--highlight) 55%, var(--highlight) 88%, transparent 88%); border-color:var(--ink)}
.slot:disabled{cursor:default}
.slot.taken{color:var(--muted); text-decoration:line-through; border-style:dashed}
.slot.mine{color:var(--ink); border-color:var(--ink); background:var(--ink-soft)}
.slot.mine span{display:block; font-size:.8rem}

.empty{padding:22px; border:2px dashed var(--line); border-radius:6px; color:var(--muted); background:var(--surface)}
.list{display:grid; gap:12px}
.card{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:6px; padding:14px 16px; display:grid; gap:6px}
.card.pendiente{border-left-color:var(--warn)}
.card.aceptada{border-left-color:var(--ok)}
.card.rechazada,.card.cancelada,.card.anulada{border-left-color:var(--bad)}
.card .when{font-family:var(--display); font-weight:700; font-size:1.15rem}
.card dl{display:grid; grid-template-columns:max-content 1fr; gap:2px 14px; margin:4px 0 0}
.card dt{color:var(--muted)}
.card dd{margin:0; overflow-wrap:anywhere}
.status{display:inline-block; padding:1px 10px; border-radius:999px; font-size:.85rem; font-weight:700; justify-self:start}
.status.pendiente{background:var(--warn-soft); color:var(--warn)}
.status.aceptada{background:var(--ok-soft); color:var(--ok)}
.status.rechazada,.status.cancelada,.status.anulada{background:var(--bad-soft); color:var(--bad)}
.actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px}

.btn{border:2px solid var(--ink); background:var(--ink); color:var(--paper); padding:8px 16px; border-radius:4px; font-weight:700; cursor:pointer}
.btn.ghost{background:transparent; color:var(--ink)}
.btn.danger{border-color:var(--bad); background:transparent; color:var(--bad)}
.btn.ok{border-color:var(--ok); background:var(--ok); color:var(--paper)}
.btn:disabled{opacity:.5; cursor:not-allowed}

.notice{padding:14px 16px; border-radius:6px; margin-bottom:20px; background:var(--ink-soft); border:1px solid var(--ink); display:flex; gap:12px; justify-content:space-between; align-items:flex-start}
.notice.good{background:var(--ok-soft); border-color:var(--ok)}
.notice.bad{background:var(--bad-soft); border-color:var(--bad)}
.notice button{background:none; border:0; cursor:pointer; color:var(--muted); font-size:1.2rem; line-height:1}

form .field,.field{display:grid; gap:4px; margin-bottom:14px}
label{font-weight:700; font-size:.95rem}
input,select,textarea{width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:4px; background:var(--paper)}
textarea{min-height:70px; resize:vertical}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.error{color:var(--bad); font-size:.95rem; margin-bottom:10px}

dialog{border:1px solid var(--line); border-radius:8px; padding:0; width:min(560px,calc(100% - 24px)); max-height:calc(100% - 24px); background:var(--surface); color:var(--text)}
dialog::backdrop{background:rgba(10,15,30,.45)}
.dlg{padding:22px 22px 18px; overflow:auto}
.dlg .summary{background:var(--ink-soft); border-radius:6px; padding:10px 14px; margin:12px 0 18px}
.dlg .summary b{font-family:var(--display)}

.settings{display:grid; gap:24px}
.table-wrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:6px}
table.week{border-collapse:collapse; width:100%; min-width:560px; font-variant-numeric:tabular-nums}
table.week th{font-family:var(--display); font-weight:700; padding:8px 4px; font-size:.95rem}
table.week th[scope="row"]{text-align:right; padding-right:12px; color:var(--muted); font-weight:500; white-space:nowrap}
table.week td{padding:3px}
.cell{width:100%; height:32px; border:1px solid var(--line); border-radius:3px; background:transparent; cursor:pointer}
.cell[aria-pressed="true"]{background:var(--highlight); border-color:var(--highlight)}
.cell:hover{border-color:var(--ink)}

footer{padding:30px 0 10px; color:var(--muted); font-size:.9rem; display:flex; gap:16px; flex-wrap:wrap; justify-content:space-between}
footer button{background:none; border:0; padding:0; color:var(--muted); text-decoration:underline; cursor:pointer}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px)); background:var(--text); color:var(--paper); padding:12px 18px; border-radius:6px; max-width:calc(100% - 32px); box-shadow:0 6px 20px rgba(0,0,0,.2); z-index:10}
.toast[hidden]{display:none}
.loading{color:var(--muted); padding:30px 0}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:up .25s ease-out}
  @keyframes up{from{opacity:0; transform:translate(-50%,10px)} to{opacity:1; transform:translate(-50%,0)}}
}
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <h1 id="h-nombre">Clases particulares</h1>
    <p class="lead" id="h-desc">Matemáticas y Física para ESO y Bachillerato.</p>
    <div class="facts" id="h-facts"></div>
  </header>
  <nav class="tabs" id="tabs" hidden></nav>
  <div id="notices"></div>
  <main id="main"><p class="loading">Cargando horario…</p></main>
  <footer><span>Pago directamente con el profesor. Clases de 1 hora.</span><button id="acceso-profe" type="button" hidden>Acceso para el profesor</button></footer>
</div>

<dialog id="dlg">
  <form class="dlg" id="form">
    <h2>Solicitar clase</h2>
    <div class="summary" id="f-summary"></div>
    <div class="row2">
      <div class="field"><label for="f-nombre">Nombre del alumno</label><input id="f-nombre" required maxlength="80" autocomplete="name"></div>
      <div class="field"><label for="f-contacto">Teléfono o email</label><input id="f-contacto" required maxlength="120"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="f-nivel">Curso</label><select id="f-nivel" required></select></div>
      <div class="field"><label for="f-asig">Asignatura</label><select id="f-asig" required></select></div>
    </div>
    <div class="field"><label for="f-ubic">¿Dónde sería la clase?</label><input id="f-ubic" required maxlength="200" placeholder="Dirección, barrio o municipio" autocomplete="street-address"></div>
    <div class="field"><label for="f-notas">Qué te gustaría trabajar <span class="hint">(opcional)</span></label><textarea id="f-notas" maxlength="600" placeholder="Por ejemplo: derivadas, examen el viernes"></textarea></div>
    <div class="actions">
      <button class="btn" type="submit" id="f-enviar">Enviar solicitud</button>
      <button class="btn ghost" type="button" id="f-cerrar">Cancelar</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-login">
  <form class="dlg" id="form-login">
    <h2>Acceso para el profesor</h2>
    <p class="hint" id="login-hint" style="margin:8px 0 16px">Entra con el email y la contraseña que creaste en Firebase.</p>
    <div class="field"><label for="l-email">Email</label><input id="l-email" type="email" autocomplete="username"></div>
    <div class="field"><label for="l-pass">Contraseña</label><input id="l-pass" type="password" autocomplete="current-password"></div>
    <p class="error" id="l-error" hidden></p>
    <div class="actions">
      <button class="btn" type="submit" id="l-entrar">Entrar</button>
      <button class="btn ghost" type="button" id="l-cerrar">Cancelar</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
/* ==========================================================================
   CONFIGURACIÓN — sustituye estos valores siguiendo la GUIA.md
   Mientras no los cambies, la página funciona en "modo demostración":
   todo se guarda solo en tu navegador.
   ========================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "PEGA_AQUI",
  authDomain: "PEGA_AQUI",
  projectId: "PEGA_AQUI",
  storageBucket: "PEGA_AQUI",
  messagingSenderId: "PEGA_AQUI",
  appId: "PEGA_AQUI"
};
const UID_PROFESOR = "PEGA_AQUI_TU_UID";
/* ========================================================================== */

const FB = "https://www.gstatic.com/firebasejs/10.12.2/";
const CONFIGURADO = !String(FIREBASE_CONFIG.apiKey).startsWith("PEGA");

const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const ORDEN_SEMANA = [1,2,3,4,5,6,0];
const HORAS = Array.from({length:14},(_,i)=>String(8+i).padStart(2,"0")+":00");
const DIAS_VISTA = 14;
const NIVELES = [
  {id:"1eso", label:"1º ESO", asig:["Matemáticas"]},
  {id:"2eso", label:"2º ESO", asig:["Matemáticas","Física y Química"]},
  {id:"3eso", label:"3º ESO", asig:["Matemáticas","Física y Química"]},
  {id:"4eso", label:"4º ESO", asig:["Matemáticas","Física y Química"]},
  {id:"1bach", label:"1º Bachillerato", asig:["Matemáticas I","Matemáticas Aplicadas a las CCSS I","Física y Química"]},
  {id:"2bach", label:"2º Bachillerato", asig:["Matemáticas II","Matemáticas Aplicadas a las CCSS II","Física"]},
];
const ESTADOS = {pendiente:"Pendiente de respuesta", aceptada:"Aceptada", rechazada:"Rechazada", cancelada:"Cancelada por el profesor", anulada:"Anulada por el alumno"};
const CONFIG_DEFECTO = {
  nombre:"Tu nombre", descripcion:"Clases particulares de Matemáticas y Física para ESO y Bachillerato.",
  precio:20, zona:"", horario:{"1":["17:00","18:00","19:00"],"2":["17:00","18:00","19:00"],"3":["17:00","18:00","19:00"],"4":["17:00","18:00","19:00"]}
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const slotId = (f,h) => f+"_"+h.replace(":","-");
const slotDate = (f,h) => { const [y,m,d]=f.split("-").map(Number); const [hh,mm]=h.split(":").map(Number); return new Date(y,m-1,d,hh,mm); };
const horaFin = h => String(Number(h.slice(0,2))+1).padStart(2,"0")+h.slice(2);
const fmtDia = f => { const d=slotDate(f,"00:00"); return DIAS[d.getDay()]+" "+d.getDate()+" de "+MESES[d.getMonth()]; };
const fmtFranja = (f,h) => fmtDia(f)+", de "+h+" a "+horaFin(h);
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const futuro = x => slotDate(x.fecha,x.hora) > new Date();
const nivelLabel = id => (NIVELES.find(n=>n.id===id)||{}).label || id;
function lsGet(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

/* ---------------- Datos: Firebase ---------------- */
async function crearFirebase(){
  const [appMod, authMod, fs] = await Promise.all([
    import(FB+"firebase-app.js"), import(FB+"firebase-auth.js"), import(FB+"firebase-firestore.js")
  ]);
  const app = appMod.initializeApp(FIREBASE_CONFIG);
  const auth = authMod.getAuth(app);
  const db = fs.getFirestore(app);
  const hoy = () => ymd(new Date());
  const lista = (s) => s.docs.map(d=>({_id:d.id, ...d.data()}));
  return {
    demo:false,
    onAuth(cb){
      return authMod.onAuthStateChanged(auth, u=>{
        if(!u){ authMod.signInAnonymously(auth).catch(()=>cb(null)); return; }
        cb({uid:u.uid, esProfe:u.uid===UID_PROFESOR});
      });
    },
    onConfig(cb,err){ return fs.onSnapshot(fs.doc(db,"config","principal"), s=>cb(s.exists()?s.data():null), err); },
    onHuecos(cb,err){ return fs.onSnapshot(fs.query(fs.collection(db,"huecos"), fs.where("fecha",">=",hoy())), s=>cb(lista(s)), err); },
    onMias(uid,cb,err){ return fs.onSnapshot(fs.query(fs.collection(db,"solicitudes"), fs.where("alumnoUid","==",uid)), s=>cb(lista(s)), err); },
    onTodas(cb,err){ return fs.onSnapshot(fs.query(fs.collection(db,"solicitudes"), fs.where("fecha",">=",hoy())), s=>cb(lista(s)), err); },
    guardarConfig(c){ return fs.setDoc(fs.doc(db,"config","principal"), c); },
    async solicitar(uid, slot, datos){
      const reqRef = fs.doc(fs.collection(db,"solicitudes"));
      const b = fs.writeBatch(db);
      b.set(reqRef, {...datos, alumnoUid:uid, fecha:slot.f, hora:slot.h, slotId:slot.id, estado:"pendiente", creada:Date.now()});
      b.set(fs.doc(db,"huecos",slot.id), {uid, reqId:reqRef.id, fecha:slot.f, hora:slot.h, estado:"pendiente"});
      try{ await b.commit(); }
      catch(e){ if(e && e.code==="permission-denied") throw {ocupado:true}; throw e; }
    },
    async responder(sol, estado){
      const b = fs.writeBatch(db);
      b.update(fs.doc(db,"solicitudes",sol._id), {estado, respondida:Date.now()});
      const h = fs.doc(db,"huecos",sol.slotId);
      if(estado==="aceptada") b.update(h,{estado:"aceptada"}); else b.delete(h);
      await b.commit();
    },
    async anular(sol){
      const b = fs.writeBatch(db);
      b.update(fs.doc(db,"solicitudes",sol._id), {estado:"anulada"});
      b.delete(fs.doc(db,"huecos",sol.slotId));
      await b.commit();
    },
    login(email,pass){ return authMod.signInWithEmailAndPassword(auth,email,pass); },
    logout(){ return authMod.signOut(auth); }
  };
}

/* ---------------- Datos: modo demostración (solo este navegador) ---------------- */
function crearDemo(){
  const K = "demo-clases-v1";
  const cargar = () => lsGet(K, {config:null, huecos:{}, solicitudes:{}});
  let st = cargar(), esProfe = lsGet(K+":profe", false), authCb = null;
  const subs = new Set();
  const emitir = () => subs.forEach(f=>f());
  const guardar = () => { lsSet(K, st); emitir(); };
  window.addEventListener("storage", e=>{ if(e.key===K){ st=cargar(); emitir(); } });
  const sub = f => { subs.add(f); setTimeout(f,0); return ()=>subs.delete(f); };
  const usuario = () => ({uid: esProfe ? "demo-profe" : "demo-alumno", esProfe});
  const nuevoId = () => Math.random().toString(36).slice(2,12);
  const sols = () => Object.entries(st.solicitudes).map(([k,s])=>({_id:k, ...s}));
  return {
    demo:true,
    onAuth(cb){ authCb=cb; setTimeout(()=>cb(usuario()),0); return ()=>{authCb=null}; },
    onConfig(cb){ return sub(()=>cb(st.config)); },
    onHuecos(cb){ return sub(()=>cb(Object.entries(st.huecos).map(([k,h])=>({_id:k, ...h})))); },
    onMias(uid,cb){ return sub(()=>cb(sols().filter(s=>s.alumnoUid===uid))); },
    onTodas(cb){ return sub(()=>cb(sols())); },
    async guardarConfig(c){ st.config=c; guardar(); },
    async solicitar(uid, slot, datos){
      if(st.huecos[slot.id]) throw {ocupado:true};
      const k = nuevoId();
      st.solicitudes[k] = {...datos, alumnoUid:uid, fecha:slot.f, hora:slot.h, slotId:slot.id, estado:"pendiente", creada:Date.now()};
      st.huecos[slot.id] = {uid, reqId:k, fecha:slot.f, hora:slot.h, estado:"pendiente"};
      guardar();
    },
    async responder(sol, estado){
      if(st.solicitudes[sol._id]) st.solicitudes[sol._id].estado = estado;
      if(estado==="aceptada"){ if(st.huecos[sol.slotId]) st.huecos[sol.slotId].estado="aceptada"; }
      else delete st.huecos[sol.slotId];
      guardar();
    },
    async anular(sol){
      if(st.solicitudes[sol._id]) st.solicitudes[sol._id].estado = "anulada";
      delete st.huecos[sol.slotId];
      guardar();
    },
    async login(){ esProfe=true; lsSet(K+":profe",true); authCb && authCb(usuario()); },
    async logout(){ esProfe=false; lsSet(K+":profe",false); authCb && authCb(usuario()); }
  };
}

/* ---------------- Estado ---------------- */
const S = {
  api:null, demo:false, uid:null, esProfe:undefined,
  config:null, configLoaded:false, huecos:new Map(), mias:[], todas:new Map(),
  vista:"reservar", borrador:null, seleccion:null, avisos:[], confirmando:null, ocupado:false, fatal:null
};

let toastTimer;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true,4200); }
function cfg(){ return S.config || CONFIG_DEFECTO; }

/* ---------------- Render ---------------- */
function render(){
  renderHero(); renderTabs(); renderNotices();
  $("acceso-profe").hidden = !S.uid || !!S.esProfe;
  const m=$("main");
  if(S.fatal){ m.innerHTML=`<div class="empty">${esc(S.fatal)}</div>`; return; }
  if(!S.configLoaded){ m.innerHTML=`<p class="loading">Cargando horario…</p>`; return; }
  if(S.esProfe && S.vista==="solicitudes") m.innerHTML=vistaSolicitudes();
  else if(S.esProfe && S.vista==="ajustes") m.innerHTML=vistaAjustes();
  else m.innerHTML=vistaReservar()+vistaMias();
}

function renderHero(){
  const c=cfg();
  $("h-nombre").textContent=c.nombre||"Clases particulares";
  $("h-desc").textContent=c.descripcion||"";
  const facts=[`<span class="price">${esc(c.precio)} €<small>por hora</small></span>`];
  if(c.zona) facts.push(`<span class="fact">Zona: <b>${esc(c.zona)}</b></span>`);
  facts.push(`<span class="fact">Matemáticas y Física para ESO y Bachillerato</span>`);
  $("h-facts").innerHTML=facts.join("");
  if(c.nombre) document.title = c.nombre + " — Clases particulares";
}

function pendientesProfe(){ return [...S.todas.values()].filter(r=>r.estado==="pendiente" && futuro(r)); }

function renderTabs(){
  const t=$("tabs");
  if(!S.esProfe){ t.hidden=true; return; }
  t.hidden=false;
  const n=pendientesProfe().length;
  const tabs=[["solicitudes","Solicitudes"+(n?`<span class="badge">${n}</span>`:"")],["ajustes","Horario y precio"],["reservar","Vista del alumno"]];
  t.innerHTML=tabs.map(([id,l])=>`<button role="tab" data-tab="${id}" aria-selected="${S.vista===id}">${l}</button>`).join("")
    + `<button class="salir" id="salir">Cerrar sesión</button>`;
}

function renderNotices(){
  $("notices").innerHTML=S.avisos.map((a,i)=>`<div class="notice ${a.tipo||""}" role="status"><p>${esc(a.texto)}</p>${a.fijo?"":`<button data-cerrar-aviso="${i}" aria-label="Cerrar aviso">×</button>`}</div>`).join("");
}

function proximosHuecos(){
  const c=cfg(), now=new Date(), dias=[];
  for(let i=0;i<DIAS_VISTA;i++){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i);
    const f=ymd(d);
    const horas=((c.horario||{})[String(d.getDay())]||[]).slice().sort();
    const slots=horas.map(h=>({f,h,id:slotId(f,h)})).filter(s=>slotDate(s.f,s.h)>now);
    if(slots.length) dias.push({d,f,slots});
  }
  return dias;
}

function vistaReservar(){
  if(!S.config){
    return `<section class="block"><div class="empty">${S.esProfe
      ? "Todavía no has publicado tu horario. Ve a <b>Horario y precio</b>, marca tus horas libres y guarda."
      : "El profesor todavía no ha publicado su horario. Vuelve a mirar en unos días."}</div></section>`;
  }
  const dias=proximosHuecos();
  const cabecera=`<div class="block-head"><h2>Elige una hora</h2><p class="hint">Clases de 1 hora. El profesor confirmará tu solicitud.</p></div>`;
  if(!dias.length) return `<section class="block">${cabecera}<div class="empty">No hay horas disponibles en las próximas dos semanas.</div></section>`;
  const html=dias.map(({d,slots})=>{
    const botones=slots.map(s=>{
      const h=S.huecos.get(s.id), txt=`${s.h} – ${horaFin(s.h)}`;
      if(h && h.uid){
        if(h.uid===S.uid) return `<button class="slot mine" disabled>${txt}<span>Tu solicitud</span></button>`;
        return `<button class="slot taken" disabled aria-label="${txt}, ocupada">${txt}</button>`;
      }
      return `<button class="slot" data-slot="${s.id}" data-f="${s.f}" data-h="${s.h}" ${S.uid?"":"disabled"} aria-label="Solicitar ${fmtFranja(s.f,s.h)}">${txt}</button>`;
    }).join("");
    return `<div class="day"><h3>${cap(DIAS[d.getDay()])}</h3><p class="date">${d.getDate()} de ${MESES[d.getMonth()]}</p>${botones}</div>`;
  }).join("");
  return `<section class="block">${cabecera}<div class="days">${html}</div></section>`;
}

function tarjeta(r, opts={}){
  const est=r.estado||"pendiente";
  const filas=[["Curso",nivelLabel(r.nivel)],["Asignatura",r.asignatura],["Lugar",r.ubicacion]];
  if(opts.profe){ filas.unshift(["Contacto",r.contacto]); filas.unshift(["Alumno",r.nombre]); }
  if(r.notas) filas.push(["Notas",r.notas]);
  const etiqueta = (!opts.profe && est==="anulada") ? "Anulada por ti" : (ESTADOS[est]||est);
  return `<article class="card ${est}">
    <span class="status ${est}">${etiqueta}</span>
    <p class="when">${esc(cap(fmtFranja(r.fecha,r.hora)))}</p>
    <dl>${filas.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    ${opts.acciones||""}
  </article>`;
}

function vistaMias(){
  if(!S.uid) return "";
  const lista=S.mias.slice().sort((a,b)=>(b.fecha+b.hora).localeCompare(a.fecha+a.hora));
  const head=`<div class="block-head"><h2>Mis solicitudes</h2><p class="hint">Se guardan en este dispositivo y navegador.</p></div>`;
  if(!lista.length) return `<section class="block">${head}<div class="empty">Cuando pidas una clase, aquí verás si el profesor la ha aceptado.</div></section>`;
  const html=lista.map(r=>{
    let acc="";
    if((r.estado==="pendiente"||r.estado==="aceptada") && futuro(r)){
      const conf=S.confirmando===r._id;
      acc=`<div class="actions"><button class="btn danger" data-anular="${esc(r._id)}">${conf?"Confirmar anulación":"Anular solicitud"}</button></div>`;
    }
    return tarjeta(r,{acciones:acc});
  }).join("");
  return `<section class="block">${head}<div class="list">${html}</div></section>`;
}

function vistaSolicitudes(){
  const orden=(a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora);
  const pend=pendientesProfe().sort(orden);
  const acept=[...S.todas.values()].filter(r=>r.estado==="aceptada" && futuro(r)).sort(orden);
  const pendHtml=pend.length?pend.map(r=>tarjeta(r,{profe:true,acciones:
    `<div class="actions"><button class="btn ok" data-aceptar="${esc(r._id)}">Aceptar</button><button class="btn danger" data-rechazar="${esc(r._id)}">Rechazar</button></div>`})).join("")
    :`<div class="empty">No tienes solicitudes pendientes.</div>`;
  const aceptHtml=acept.length?acept.map(r=>{
    const conf=S.confirmando===r._id;
    return tarjeta(r,{profe:true,acciones:`<div class="actions"><button class="btn danger" data-cancelar="${esc(r._id)}">${conf?"Confirmar cancelación":"Cancelar clase"}</button></div>`});
  }).join(""):`<div class="empty">Aún no tienes clases confirmadas.</div>`;
  return `<section class="block"><div class="block-head"><h2>Pendientes de respuesta</h2><p class="hint">Al aceptar o rechazar, el alumno lo verá en la página.</p></div><div class="list">${pendHtml}</div></section>
          <section class="block"><div class="block-head"><h2>Próximas clases</h2></div><div class="list">${aceptHtml}</div></section>`;
}

function vistaAjustes(){
  if(!S.borrador) S.borrador=JSON.parse(JSON.stringify(cfg()));
  const b=S.borrador;
  const cab=ORDEN_SEMANA.map(d=>`<th scope="col">${cap(DIAS[d]).slice(0,3)}</th>`).join("");
  const filas=HORAS.map(h=>`<tr><th scope="row">${h} – ${horaFin(h)}</th>${ORDEN_SEMANA.map(d=>{
    const on=((b.horario||{})[String(d)]||[]).includes(h);
    return `<td><button class="cell" data-dia="${d}" data-hora="${h}" aria-pressed="${on}" aria-label="${DIAS[d]} ${h}"></button></td>`;
  }).join("")}</tr>`).join("");
  return `<section class="block settings">
    ${S.config?"":`<div class="notice"><p>Estos son valores de ejemplo. Cámbialos y pulsa <b>Guardar cambios</b> para que los alumnos vean tu horario.</p></div>`}
    <form id="ajustes" onsubmit="return false">
      <div class="row2">
        <div class="field"><label for="a-nombre">Tu nombre o el de tus clases</label><input id="a-nombre" maxlength="80" value="${esc(b.nombre)}"></div>
        <div class="field"><label for="a-precio">Precio por hora (€)</label><input id="a-precio" type="number" min="0" step="0.5" value="${esc(b.precio)}"></div>
      </div>
      <div class="field"><label for="a-desc">Presentación</label><textarea id="a-desc" maxlength="400">${esc(b.descripcion)}</textarea></div>
      <div class="field"><label for="a-zona">Zona donde das clase <span class="hint">(opcional)</span></label><input id="a-zona" maxlength="120" value="${esc(b.zona)}" placeholder="Por ejemplo: centro y alrededores, o online"></div>
    </form>
    <div>
      <div class="block-head"><h2>Horas libres cada semana</h2><p class="hint">Marca las horas en las que puedes dar clase. Se repiten cada semana.</p></div>
      <div class="table-wrap"><table class="week"><thead><tr><th></th>${cab}</tr></thead><tbody>${filas}</tbody></table></div>
    </div>
    <div class="actions"><button class="btn" id="guardar">Guardar cambios</button><button class="btn ghost" id="descartar">Descartar</button></div>
  </section>`;
}

/* ---------------- Acciones ---------------- */
function leerAjustesForm(){
  if(!$("ajustes")||!S.borrador) return;
  S.borrador.nombre=$("a-nombre").value.trim();
  S.borrador.precio=Number($("a-precio").value)||0;
  S.borrador.descripcion=$("a-desc").value.trim();
  S.borrador.zona=$("a-zona").value.trim();
}

async function guardarAjustes(){
  leerAjustesForm();
  const b=S.borrador, horario={};
  for(const d of Object.keys(b.horario||{})){ const hs=[...new Set(b.horario[d])].sort(); if(hs.length) horario[d]=hs; }
  const btn=$("guardar"); btn.disabled=true;
  try{
    await S.api.guardarConfig({nombre:b.nombre||"Clases particulares", precio:b.precio, descripcion:b.descripcion, zona:b.zona, horario, actualizado:Date.now()});
    S.borrador=null; toast("Cambios guardados. Los alumnos ya ven tu horario."); render();
  }catch(e){ toast("No se pudieron guardar los cambios. Revisa que has entrado como profesor."); btn.disabled=false; }
}

function abrirFormulario(f,h,id){
  S.seleccion={f,h,id};
  $("f-summary").innerHTML=`<b>${esc(cap(fmtFranja(f,h)))}</b><br>${esc(cfg().precio)} € la hora, se paga directamente al profesor`;
  const g=lsGet("alumno",{});
  $("f-nombre").value=g.nombre||""; $("f-contacto").value=g.contacto||""; $("f-ubic").value=g.ubicacion||"";
  $("f-nivel").innerHTML=NIVELES.map(n=>`<option value="${n.id}">${n.label}</option>`).join("");
  if(g.nivel) $("f-nivel").value=g.nivel;
  llenarAsignaturas(g.asignatura);
  $("f-notas").value=""; $("f-enviar").disabled=false;
  abrir($("dlg"));
}
function llenarAsignaturas(pref){
  const n=NIVELES.find(x=>x.id===$("f-nivel").value)||NIVELES[0];
  $("f-asig").innerHTML=n.asig.map(a=>`<option>${esc(a)}</option>`).join("");
  if(pref && n.asig.includes(pref)) $("f-asig").value=pref;
}
function abrir(d){ if(typeof d.showModal==="function") d.showModal(); else d.setAttribute("open",""); }
function cerrar(d){ if(d.open) d.close(); }

async function enviarSolicitud(){
  const sel=S.seleccion; if(!sel||S.ocupado) return;
  const datos={
    nombre:$("f-nombre").value.trim(), contacto:$("f-contacto").value.trim(),
    nivel:$("f-nivel").value, asignatura:$("f-asig").value,
    ubicacion:$("f-ubic").value.trim(), notas:$("f-notas").value.trim()
  };
  if(!datos.nombre||!datos.contacto||!datos.ubicacion){ toast("Rellena nombre, contacto y lugar de la clase."); return; }
  lsSet("alumno",{nombre:datos.nombre,contacto:datos.contacto,ubicacion:datos.ubicacion,nivel:datos.nivel,asignatura:datos.asignatura});
  S.ocupado=true; $("f-enviar").disabled=true;
  try{
    await S.api.solicitar(S.uid, sel, datos);
    cerrar($("dlg")); S.seleccion=null;
    toast("Solicitud enviada. Verás aquí mismo si el profesor la acepta.");
  }catch(e){
    if(e && e.ocupado){ cerrar($("dlg")); toast("Esa hora ya no está libre. Elige otra."); }
    else { toast("No se pudo enviar la solicitud. Revisa tu conexión e inténtalo de nuevo."); $("f-enviar").disabled=false; }
  }finally{ S.ocupado=false; }
}

async function responder(id, estado){
  const r=S.todas.get(id); if(!r) return;
  try{
    await S.api.responder(r, estado);
    S.confirmando=null;
    toast(estado==="aceptada"?"Clase aceptada.":estado==="rechazada"?"Solicitud rechazada. La hora vuelve a estar libre.":"Clase cancelada. La hora vuelve a estar libre.");
  }catch(e){ toast("No se pudo guardar la respuesta. Inténtalo de nuevo."); }
}

async function anular(id){
  const r=S.mias.find(x=>x._id===id); if(!r) return;
  try{ await S.api.anular(r); S.confirmando=null; toast("Solicitud anulada."); }
  catch(e){ toast("No se pudo anular. Inténtalo de nuevo."); }
}

async function login(){
  const err=$("l-error"); err.hidden=true; $("l-entrar").disabled=true;
  try{
    await S.api.login($("l-email").value.trim(), $("l-pass").value);
    cerrar($("dlg-login")); $("l-pass").value="";
  }catch(e){
    err.textContent="Email o contraseña incorrectos."; err.hidden=false;
  }finally{ $("l-entrar").disabled=false; }
}

/* ---------------- Eventos ---------------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("button"); if(!el) return;
  if(el.dataset.tab){ if(S.vista==="ajustes") leerAjustesForm(); S.vista=el.dataset.tab; S.confirmando=null; render(); return; }
  if(el.dataset.cerrarAviso!==undefined){ S.avisos.splice(Number(el.dataset.cerrarAviso),1); renderNotices(); return; }
  if(el.dataset.slot){ abrirFormulario(el.dataset.f,el.dataset.h,el.dataset.slot); return; }
  if(el.id==="f-cerrar"){ cerrar($("dlg")); return; }
  if(el.id==="l-cerrar"){ cerrar($("dlg-login")); return; }
  if(el.id==="acceso-profe"){
    $("login-hint").textContent = S.demo ? "Modo demostración: pulsa Entrar, no hace falta contraseña." : "Entra con el email y la contraseña que creaste en Firebase.";
    $("l-error").hidden=true; abrir($("dlg-login")); return;
  }
  if(el.id==="salir"){ S.api.logout(); return; }
  if(el.dataset.aceptar){ responder(el.dataset.aceptar,"aceptada"); return; }
  if(el.dataset.rechazar){ responder(el.dataset.rechazar,"rechazada"); return; }
  if(el.dataset.cancelar){ const k=el.dataset.cancelar; if(S.confirmando===k) responder(k,"cancelada"); else { S.confirmando=k; render(); } return; }
  if(el.dataset.anular){ const k=el.dataset.anular; if(S.confirmando===k) anular(k); else { S.confirmando=k; render(); } return; }
  if(el.classList.contains("cell")){
    leerAjustesForm();
    const d=el.dataset.dia, h=el.dataset.hora, hor=S.borrador.horario||(S.borrador.horario={});
    const arr=hor[d]||(hor[d]=[]); const i=arr.indexOf(h);
    if(i>=0) arr.splice(i,1); else arr.push(h);
    el.setAttribute("aria-pressed", String(i<0)); return;
  }
  if(el.id==="guardar"){ guardarAjustes(); return; }
  if(el.id==="descartar"){ S.borrador=null; render(); toast("Cambios descartados."); return; }
});
$("f-nivel").addEventListener("change",()=>llenarAsignaturas());
$("form").addEventListener("submit",e=>{ e.preventDefault(); enviarSolicitud(); });
$("form-login").addEventListener("submit",e=>{ e.preventDefault(); login(); });

/* ---------------- Avisos al alumno ---------------- */
function avisarCambios(){
  const clave="vistos:"+S.uid, vistos=lsGet(clave,{}); let cambio=false;
  for(const r of S.mias){
    const antes=vistos[r._id];
    if(antes && antes!==r.estado && ["aceptada","rechazada","cancelada"].includes(r.estado)){
      const f=fmtFranja(r.fecha,r.hora);
      const t= r.estado==="aceptada" ? `¡Tu clase del ${f} ha sido aceptada!`
             : r.estado==="rechazada" ? `El profesor no puede darte la clase del ${f}. Elige otra hora.`
             : `El profesor ha cancelado la clase del ${f}.`;
      S.avisos.push({texto:t, tipo:r.estado==="aceptada"?"good":"bad"});
    }
    if(antes!==r.estado){ vistos[r._id]=r.estado; cambio=true; }
  }
  if(cambio) lsSet(clave,vistos);
}

/* ---------------- Arranque ---------------- */
let unsubMias=null, unsubTodas=null;
async function iniciar(){
  render();
  try{ S.api = CONFIGURADO ? await crearFirebase() : crearDemo(); }
  catch(e){ S.fatal="No se pudo conectar con la base de datos. Revisa tu conexión y recarga la página."; render(); return; }
  S.demo=S.api.demo;
  if(S.demo) S.avisos.push({fijo:true, texto:"Modo demostración: los datos se guardan solo en este navegador. Para probar como profesor, usa el enlace “Acceso para el profesor” al pie de la página."});

  S.api.onConfig(c=>{ S.config=c; S.configLoaded=true; render(); },
    ()=>{ S.configLoaded=true; S.avisos.push({tipo:"bad", texto:"No se pudo leer el horario. Si eres el profesor, revisa las reglas de Firestore."}); render(); });
  S.api.onHuecos(list=>{ S.huecos=new Map(list.map(h=>[h._id,h])); render(); }, ()=>{});
  S.api.onAuth(u=>{
    if(!u){ S.fatal="No se pudo iniciar la sesión. Si eres el profesor, activa el acceso anónimo en Firebase Authentication."; render(); return; }
    const cambioRol = S.esProfe!==u.esProfe;
    S.uid=u.uid; S.esProfe=u.esProfe;
    if(unsubMias) unsubMias();
    if(unsubTodas){ unsubTodas(); unsubTodas=null; }
    S.mias=[]; S.todas=new Map();
    unsubMias=S.api.onMias(u.uid, list=>{ S.mias=list; avisarCambios(); render(); }, ()=>{});
    if(u.esProfe) unsubTodas=S.api.onTodas(list=>{ S.todas=new Map(list.map(r=>[r._id,r])); render(); }, ()=>{});
    if(cambioRol){ S.vista = u.esProfe ? "solicitudes" : "reservar"; S.borrador=null; S.confirmando=null; }
    render();
  });
}
iniciar();
</script>
